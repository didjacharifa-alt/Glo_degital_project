<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agence — Gestion Clients &amp; Projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --brand-ink:#122A3E;
  --brand-steel:#2B4C66;
  --brand-accent:#D98A3D;
  --bg:#F2F4F3;
  --surface:#FFFFFF;
  --surface-2:#F8F9F8;
  --text:#152230;
  --muted:#5B6B78;
  --border:#E1E5E3;
  --done:#2F9E63;
  --progress:#D9822B;
  --late:#D64545;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,33,.06), 0 4px 14px rgba(16,24,33,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--brand-accent);color:#fff;}

#app{min-height:100vh;display:flex;flex-direction:column;}
.navbar{
  background:var(--brand-ink);color:#fff;display:flex;align-items:center;gap:18px;
  padding:0 24px;height:64px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow);
}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
.nav-logo img{height:36px;width:36px;object-fit:cover;border-radius:8px;}
.logo-box{
  height:36px;width:36px;border-radius:8px;background:var(--brand-accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora';font-weight:800;color:#1a1a1a;font-size:14px;
}
.nav-company{font-family:'Sora';font-weight:700;font-size:16px;}
.nav-spacer{flex:1;}
.nav-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:#fff;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;transition:background .15s;
}
.nav-btn:hover{background:rgba(255,255,255,.18);}
.nav-btn.internal{background:var(--brand-accent);border-color:var(--brand-accent);color:#1a1a1a;}
.nav-user{font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:10px;}
.role-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.12);letter-spacing:.03em;}
.role-pill.admin{background:var(--brand-accent);color:#1a1a1a;}

.breadcrumb{padding:14px 28px 0 28px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.breadcrumb a:hover{color:var(--brand-steel);text-decoration:underline;}
.breadcrumb .sep{opacity:.5;}

main{flex:1;padding:18px 28px 60px 28px;max-width:1180px;width:100%;margin:0 auto;}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:10px 0 22px 0;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:4px;}

.btn{
  border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;
  background:var(--brand-ink);color:#fff;transition:opacity .15s, transform .1s;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{opacity:.88;}
.btn:active{transform:translateY(1px);}
.btn.accent{background:var(--brand-accent);color:#1a1a1a;}
.btn.ghost{background:transparent;color:var(--brand-ink);border:1px solid var(--border);}
.btn.danger{background:#fdecec;color:var(--late);}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.grid{display:grid;gap:14px;}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s;
}
.card.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(16,24,33,.1);cursor:pointer;}

.entity-card{display:flex;flex-direction:column;gap:10px;}
.entity-top{display:flex;align-items:center;gap:12px;}
.avatar{
  height:44px;width:44px;border-radius:10px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;
  color:var(--brand-steel);border:1px solid var(--border);font-size:15px;flex:none;object-fit:cover;
}
.entity-name{font-family:'Sora';font-weight:700;font-size:15px;}
.entity-meta{font-size:12.5px;color:var(--muted);}
.entity-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);}
.entity-stats b{font-weight:700;}
.entity-stats .stat-done b{color:var(--done);}
.entity-stats .stat-progress b{color:var(--progress);}
.entity-stats .stat-late b{color:var(--late);}

.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.01em;}
.status-dot{height:7px;width:7px;border-radius:50%;display:inline-block;}
.status-effectue{background:#e5f6ec;color:var(--done);}
.status-effectue .status-dot{background:var(--done);}
.status-encours{background:#fdf1e2;color:var(--progress);}
.status-encours .status-dot{background:var(--progress);}
.status-retard{background:#fbe9e9;color:var(--late);}
.status-retard .status-dot{background:var(--late);}

.section-title{font-family:'Sora';font-weight:700;font-size:16px;margin:26px 0 12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand-steel);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;}
.kpi-value{font-family:'Sora';font-weight:700;font-size:22px;}
.kpi-pct{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px;}
.kpi-card.kpi-late{border-left-color:var(--late);}
.kpi-card.kpi-progress{border-left-color:var(--progress);}
.kpi-card.kpi-done{border-left-color:var(--done);}
.kpi-card.kpi-byemployee{grid-column:span 2;border-left-color:var(--late);}
.kpi-emp-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);}
.kpi-emp-row:last-child{border-bottom:none;}
@media (max-width:600px){ .kpi-card.kpi-byemployee{grid-column:span 1;} }

.project-row{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.project-row:hover{border-color:var(--brand-steel);}
.project-main{flex:1;min-width:0;}
.project-main h4{font-size:14.5px;font-weight:700;}
.project-main .desc{font-size:12.5px;color:var(--muted);margin-top:2px;}
.project-tags{font-size:12px;color:var(--muted);margin-top:4px;}

.task-single{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
table.tasks{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
table.tasks th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  background:var(--surface-2);padding:10px 12px;border-bottom:1px solid var(--border);
}
table.tasks td{padding:11px 12px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:top;}
/* La colonne « Fiche » ayant élargi le tableau, les dates ne doivent pas
   se couper en deux lignes. Le tableau défile plutôt horizontalement. */
table.tasks td.date{white-space:nowrap;}
.tasks-scroll{overflow-x:auto;}
table.tasks tr:last-child td{border-bottom:none;}
.progress-bar{height:6px;border-radius:4px;background:var(--surface-2);width:100%;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;background:var(--brand-steel);}
.obs{font-size:12.5px;color:var(--muted);font-style:italic;max-width:220px;}
.task-actions{display:flex;gap:6px;}

.meeting-row{
  display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 16px;margin-bottom:8px;box-shadow:var(--shadow);
}
.meeting-date{font-family:'IBM Plex Mono';font-size:12px;background:var(--surface-2);border-radius:6px;padding:6px 9px;color:var(--brand-steel);font-weight:600;flex:none;}
.meeting-title{flex:1;font-weight:600;font-size:14px;}
.shared-tag{font-size:11px;color:var(--done);font-weight:700;}

.report-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.report-box h3{margin-bottom:10px;}
.todo-block{margin-top:16px;background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;padding:14px;}
.todo-block h4{font-size:13px;color:var(--brand-steel);margin-bottom:8px;}
/* Ce textarea n'est pas dans un .field : sans cette règle il garde la largeur
   par défaut du navigateur, soit une vingtaine de caractères. */
.todo-block textarea{width:100%;min-height:80px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;resize:vertical;}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--brand-ink);}
.login-card{background:var(--surface);padding:38px 36px;border-radius:14px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login-card .logo-box{margin:0 auto 14px auto;height:52px;width:52px;font-size:19px;}
.login-card h1{text-align:center;font-size:20px;}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 22px 0;}
.field{margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;}
.field input, .field textarea, .field select{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--surface);
}
.field textarea{resize:vertical;min-height:70px;}
.login-hint{margin-top:18px;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px;line-height:1.5;}
.err{color:var(--late);font-size:12.5px;margin-top:8px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,32,.55);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:100;overflow-y:auto;
}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal h3{margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Les messages s'empilent : deux toasts consécutifs (« Envoi… » puis
   « Fichier joint. ») se superposaient au même endroit. */
.toast-stack{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{
  background:var(--brand-ink);color:#fff;padding:13px 18px;border-radius:10px;
  font-size:13.5px;box-shadow:var(--shadow);max-width:340px;animation:toastIn .25s ease;
}
.toast.err{background:var(--late);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.empty{color:var(--muted);font-size:13.5px;padding:22px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface-2);}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}

/* ---- Pièces jointes ---- */
.file-cell{display:flex;flex-direction:column;gap:6px;min-width:150px;}
.file-actions{display:flex;gap:6px;flex-wrap:wrap;}
.file-link{
  color:var(--brand-steel);font-weight:600;font-size:12.5px;
  display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;
}
.file-link:hover{text-decoration:underline;}
.file-none{color:var(--muted);font-size:12.5px;}
.file-size{color:var(--muted);font-size:11.5px;margin-left:6px;}
.file-block{margin-top:16px;background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;padding:14px;}
.file-block h4{font-size:13px;color:var(--brand-steel);margin-bottom:8px;}

/* ---- Import de tâches ---- */
.import-hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:12px;line-height:1.55;}
.import-cols{width:100%;border-collapse:collapse;margin:8px 0;}
.import-cols td{padding:3px 6px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:top;}
.import-cols tr:last-child td{border-bottom:none;}
.import-cols td:first-child{white-space:nowrap;color:var(--text);width:38%;}
.import-errors{margin:0;padding-left:18px;max-height:240px;overflow-y:auto;font-size:12.5px;color:var(--muted);line-height:1.6;}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.settings-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.settings-block h4{margin-bottom:12px;font-size:14px;}
.userline{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.userline:last-child{border-bottom:none;}
@media (max-width:720px){
  .settings-grid{grid-template-columns:1fr;}
  .grid2{grid-template-columns:1fr;}
  main{padding:14px;}
}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Chargement…</div></div>

<script>
/* =========================================================================
   ÉTAT — les données viennent maintenant de MySQL via api.php (fetch)
   Plus aucune donnée n'est stockée dans le navigateur (localStorage supprimé).
   ========================================================================= */
let STATE = null;

function todayISO(){ return new Date().toISOString().slice(0,10); }

async function apiCall(action, method='GET', body=null){
  const opts = { method, credentials:'same-origin', headers:{} };
  if(body){ opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  let res, data;
  try{
    res = await fetch('api.php?action='+encodeURIComponent(action), opts);
  }catch(e){
    throw new Error('Impossible de joindre le serveur.');
  }
  try{ data = await res.json(); }catch(e){ data = {}; }
  if(!res.ok){ throw new Error(data.error || ('Erreur serveur ('+res.status+')')); }
  return data;
}

// Envoi de fichier : le navigateur doit poser lui-même l'en-tête multipart
// (avec sa frontière), on ne fixe donc surtout pas Content-Type ici.
async function apiUpload(action, formData){
  let res, data;
  try{
    res = await fetch('api.php?action='+encodeURIComponent(action), {
      method:'POST', credentials:'same-origin', body: formData
    });
  }catch(e){
    throw new Error('Impossible de joindre le serveur.');
  }
  try{ data = await res.json(); }catch(e){ data = {}; }
  if(!res.ok){ throw new Error(data.error || ('Erreur serveur ('+res.status+')')); }
  return data;
}

// Les noms de fichiers viennent de l'utilisateur et sont insérés dans du HTML.
function esc(value){
  return String(value==null?'':value)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}

function formatFileSize(bytes){
  if(!bytes && bytes!==0) return '';
  if(bytes < 1024) return bytes+' o';
  if(bytes < 1024*1024) return Math.round(bytes/1024)+' Ko';
  return (bytes/1024/1024).toFixed(1).replace('.',',')+' Mo';
}

async function refreshState(){
  STATE = await apiCall('state');
}

/* ---------------- Helpers métier (lecture seule, sur STATE) ---------------- */
function currentUser(){ return STATE && STATE.loggedIn ? STATE.user : null; }
function isAdmin(){ const u = currentUser(); return !!u && u.role==='ADMIN'; }
function entityById(id){ return STATE.entities.find(e=>e.id===id); }
function projectById(id){ return STATE.projects.find(p=>p.id===id); }
function tasksOf(projectId){ return STATE.tasks.filter(t=>t.projectId===projectId); }
function projectsOf(entityId){ return STATE.projects.filter(p=>p.entityId===entityId); }
function meetingsOf(projectId){ return STATE.meetings.filter(m=>m.projectId===projectId); }
function reportOfMeeting(meetingId){ return STATE.reports.find(r=>r.meetingId===meetingId); }

function computeProjectStatus(project){
  const tasks = tasksOf(project.id);
  if(tasks.length===0){
    if(project.endDate && new Date(project.endDate) < new Date(todayISO())) return 'retard';
    return 'encours';
  }
  if(tasks.every(t=>t.status==='effectue')) return 'effectue';
  if(tasks.some(t=>t.status==='retard')) return 'retard';
  return 'encours';
}
function computeEntityStatus(entity){
  const projects = projectsOf(entity.id);
  if(projects.length===0) return 'encours';
  const statuses = projects.map(computeProjectStatus);
  if(statuses.every(s=>s==='effectue')) return 'effectue';
  if(statuses.some(s=>s==='retard')) return 'retard';
  return 'encours';
}
const STATUS_LABEL = {effectue:'Effectué', encours:'En cours', retard:'En retard'};
function statusBadge(status){
  return `<span class="status-badge status-${status}"><span class="status-dot"></span>${STATUS_LABEL[status]||status}</span>`;
}

function applyTheme(){
  if(!STATE || !STATE.settings) return;
  const r = document.documentElement.style;
  r.setProperty('--brand-ink', STATE.settings.primaryColor);
  r.setProperty('--brand-steel', STATE.settings.secondaryColor);
  r.setProperty('--brand-accent', STATE.settings.accentColor);
}

/* ---------------- Router ---------------- */
function go(hash){ location.hash = hash; }
window.addEventListener('hashchange', render);

function currentRoute(){
  const h = location.hash.slice(1) || '/home';
  return h.split('/').filter(Boolean);
}

/* ---------------- Toast ---------------- */
function toast(msg, isError){
  let stack = document.getElementById('toastStack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'toastStack';
    stack.className = 'toast-stack';
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className='toast' + (isError?' err':'');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ---------------- Modal générique (supporte onSubmit async) ---------------- */
function openModal(title, bodyHtml, onSubmit, submitLabel){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      <form id="modalForm">${bodyHtml}</form>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Annuler</button>
        <button type="submit" form="modalForm" class="btn accent" id="modalSubmit">${submitLabel||'Enregistrer'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#modalCancel').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#modalForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const data = new FormData(e.target);
    const obj = {};
    for(const [k,v] of data.entries()) obj[k]=v;
    const submitBtn = overlay.querySelector('#modalSubmit');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = 'Enregistrement…';
    try{
      await onSubmit(obj);
      overlay.remove();
    }catch(err){
      toast(err.message || 'Une erreur est survenue.', true);
      submitBtn.disabled = false; submitBtn.textContent = originalLabel;
    }
  });
  return overlay;
}

function guardAdmin(){
  if(!isAdmin()){ toast("Action réservée au rôle ADMIN.", true); return false; }
  return true;
}

/* =========================================================================
   RENDER — VUES
   ========================================================================= */
function render(){
  applyTheme();
  const app = document.getElementById('app');
  if(!STATE || !STATE.loggedIn){ app.innerHTML = viewLogin(); bindLogin(); return; }

  const route = currentRoute();
  let content = '';
  if(route[0]==='home' || route.length===0) content = viewHome();
  else if(route[0]==='entity') content = viewEntity(route[1]);
  else if(route[0]==='project') content = viewProject(route[1]);
  else if(route[0]==='meeting') content = viewMeeting(route[1]);
  else if(route[0]==='settings') content = viewSettings();
  else content = `<div class="empty">Page introuvable.</div>`;

  app.innerHTML = `${navbar()}${content}`;
  bindGlobalActions();
}

function navbar(){
  const u = currentUser();
  const s = STATE.settings;
  const logo = s.logoDataUrl ? `<img src="${s.logoDataUrl}" alt="logo">` : `<div class="logo-box">${s.logoText}</div>`;
  const internal = STATE.entities.find(e=>e.isInternal);
  return `
  <div class="navbar">
    <div class="nav-logo" onclick="go('/home')">
      ${logo}
      <div class="nav-company">${s.companyName}</div>
    </div>
    ${internal ? `<button class="nav-btn internal" onclick="go('/entity/${internal.id}')">🏢 Mon entreprise</button>` : ''}
    <div class="nav-spacer"></div>

function breadcrumb(items){
  return `<div class="breadcrumb">${items.map((it,i)=>{
    const isLast = i===items.length-1;
    const sep = i>0 ? `<span class="sep">/</span>` : '';
    return sep + (isLast ? `<span>${it.label}</span>` : `<a href="#${it.hash}">${it.label}</a>`);
  }).join('')}</div>`;
}

/* ---------- PROJECT DETAIL ---------- */
function computeTaskKPIs(tasks){
  const total = tasks.length;
  const late = tasks.filter(t=>t.status==='retard').length;
  const done = tasks.filter(t=>t.status==='effectue').length;
  const inProgress = tasks.filter(t=>t.status==='encours').length;
  const pct = n => total ? Math.round((n/total)*100) : 0;
  const lateByEmployee = {};
  tasks.filter(t=>t.status==='retard').forEach(t=>{
    const key = t.employee || 'Non assigné';
    lateByEmployee[key] = (lateByEmployee[key]||0)+1;
  });
  return {total, late, done, inProgress, latePct:pct(late), donePct:pct(done), inProgressPct:pct(inProgress), lateByEmployee};
}

function kpiBlock(tasks){
  const k = computeTaskKPIs(tasks);
  const employeeRows = Object.entries(k.lateByEmployee).sort((a,b)=>b[1]-a[1]);
  return `
  <div class="kpi-grid">
    <div class="kpi-card kpi-total">
      <div class="kpi-label">Total tâches</div>
      <div class="kpi-value">${k.total}</div>
    </div>
    <div class="kpi-card kpi-late">
      <div class="kpi-label">En retard</div>
      <div class="kpi-value">${k.late} <span class="kpi-pct">${k.latePct}%</span></div>
    </div>
    <div class="kpi-card kpi-progress">
      <div class="kpi-label">En cours</div>
      <div class="kpi-value">${k.inProgress} <span class="kpi-pct">${k.inProgressPct}%</span></div>
    </div>
    <div class="kpi-card kpi-done">
      <div class="kpi-label">Effectuées</div>
      <div class="kpi-value">${k.done} <span class="kpi-pct">${k.donePct}%</span></div>
    </div>
    ${employeeRows.length ? `
    <div class="kpi-card kpi-byemployee">
      <div class="kpi-label">Retard par responsable</div>
      ${employeeRows.map(([name,count])=>`<div class="kpi-emp-row"><span>${name}</span><b>${count}</b></div>`).join('')}
    </div>` : ''}
  </div>`;
}

    ? [{label:'Accueil',hash:'/home'},{label:'Mon entreprise',hash:'/entity/'+entity.id},{label:p.name}]

      </div>

      <div class="file-block">
        <h4>Compte-rendu joint</h4>
        ${report.fileName ? `
          <a class="file-link" href="api.php?action=download&type=report&id=${encodeURIComponent(report.id)}">📎 ${esc(report.fileName)}</a>
          <span class="file-size">${formatFileSize(report.fileSize)}</span>

        ${isAdmin() && report.id ? `

            <button class="btn ghost sm" onclick="pickReportFile('${report.id}')">${report.fileName?'Remplacer le fichier':'Joindre un fichier'}</button>

      </div>` : ''}
    </div>
  </main>`;
}
function bindMeetingActions(reportId){
  const saveBtn = document.getElementById('btnSaveReport');
  const shareBtn = document.getElementById('btnShareReport');
  if(saveBtn) saveBtn.onclick = async ()=>{
    if(!guardAdmin()) return;
    saveBtn.disabled = true;
    try{
      await apiCall('save_report','POST',{id:reportId, summary:document.getElementById('repSummary').value, todoRaw:document.getElementById('repTodo').value});
      toast('Brouillon enregistré.');
    }catch(err){ toast(err.message, true); }
    saveBtn.disabled = false;
  };
  if(shareBtn) shareBtn.onclick = async ()=>{
    if(!guardAdmin()) return;
    shareBtn.disabled = true;
    try{
      const res = await apiCall('share_report','POST',{id:reportId, summary:document.getElementById('repSummary').value, todoRaw:document.getElementById('repTodo').value});
      await refreshState();
      render();
      toast(`Compte-rendu partagé. ${res.created} tâche(s) créée(s).`);
    }catch(err){ toast(err.message, true); shareBtn.disabled = false; }
  };
}

// Le serveur réconcilie statut et avancement (« effectué » vaut 100 %, et
// inversement). On applique la même règle dans le formulaire pour que l'écran
// montre ce qui sera réellement enregistré.
function bindTaskFormCoupling(overlay){
  const statusEl = overlay.querySelector('select[name=status]');
  const progressEl = overlay.querySelector('input[name=progress]');
  if(!statusEl || !progressEl) return;

  statusEl.addEventListener('change', ()=>{
    if(statusEl.value === 'effectue') progressEl.value = 100;
    // Repasser une tâche terminée en cours suppose de rouvrir l'avancement,
    // sinon le serveur la remettrait aussitôt en « effectué ».
    else if(Number(progressEl.value) >= 100) progressEl.value = 90;
  });

  progressEl.addEventListener('input', ()=>{
    if(Number(progressEl.value) >= 100) statusEl.value = 'effectue';
    else if(statusEl.value === 'effectue') statusEl.value = 'encours';
  });
}

function createTaskModal(projectId){
  if(!guardAdmin()) return;
  const overlay = openModal('Nouvelle tâche', taskFormBody(), async data=>{
    await apiCall('create_task','POST',{projectId, name:data.name, employee:data.employee, progress:Number(data.progress)||0, status:data.status, startDate:data.startDate, endDate:data.endDate, observation:data.observation});

  }, 'Créer');

}
function editTaskModal(taskId){
  if(!guardAdmin()) return;
  const t = STATE.tasks.find(x=>x.id===taskId);

  // garde-fou, le formulaire s'ouvrait vide puis échouait sur t.id.
  if(!t){ toast("Cette tâche n'existe plus.", true); return; }
  const overlay = openModal('Modifier la tâche', taskFormBody(t), async data=>{
    await apiCall('update_task','POST',{id:t.id, name:data.name, employee:data.employee, progress:Number(data.progress)||0, status:data.status, startDate:data.startDate, endDate:data.endDate, observation:data.observation});
    await refreshState(); render(); toast('Tâche mise à jour.');
  }, 'Enregistrer');

/* =========================================================================

   ========================================================================= */

const UPLOAD_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.odt,.ods,.png,.jpg,.jpeg,.gif,.webp,.zip';

// Ouvre le sélecteur de fichiers du navigateur puis envoie le fichier retenu.
function pickAndUpload(action, id){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = UPLOAD_ACCEPT;
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async ()=>{
    const file = input.files && input.files[0];
    input.remove();
    if(!file) return;
    const fd = new FormData();
    fd.append('id', id);
    fd.append('file', file);
    toast('Envoi du fichier…');
    try{
      await apiUpload(action, fd);
      await refreshState(); render(); toast('Fichier joint.');
    }catch(err){ toast(err.message, true); }
  });
  input.click();
}

/* =========================================================================
   IMPORT DE TÂCHES DEPUIS UN TABLEAU

function importTasksModal(projectId){
  if(!guardAdmin()) return;
  let overlay;
  overlay = openModal('Importer des tâches', `
    <div class="field">
      <label>Fichier Excel (.xlsx), CSV ou Word (.docx)</label>
      <input name="file" type="file" accept=".xlsx,.csv,.docx" required>
    </div>
    <div class="import-hint">
      <b>Format attendu</b> — la première ligne du tableau sert d'en-tête.
      Seule la colonne du nom est obligatoire ; les autres sont facultatives
      et peuvent être dans n'importe quel ordre.
      <table class="import-cols">
        <tr><td><b>Tâche</b></td><td>nom de la tâche <i>(obligatoire)</i></td></tr>
        <tr><td>Responsable</td><td>nom de l'employé</td></tr>
        <tr><td>Avancement</td><td>0 à 100, le signe % est accepté</td></tr>
        <tr><td>Statut</td><td>en cours · effectué · en retard</td></tr>
        <tr><td>Début</td><td>JJ/MM/AAAA ou AAAA-MM-JJ</td></tr>
        <tr><td>Fin</td><td>idem — aussi « échéance »</td></tr>
        <tr><td>Observation</td><td>commentaire libre</td></tr>
      </table>
      Les lignes sans nom de tâche sont ignorées et signalées à la fin.
    </div>
  `, async ()=>{
    const input = overlay.querySelector('input[name=file]');
    const file = input.files && input.files[0];
    if(!file) throw new Error('Choisissez un fichier à importer.');

    const fd = new FormData();
    fd.append('projectId', projectId);
    fd.append('file', file);
    const res = await apiUpload('import_tasks', fd);

    await refreshState(); render();
    if(res.errors && res.errors.length){
      showImportReport(res.created, res.errors);
    }else{
      toast(`${res.created} tâche(s) importée(s).`);
    }
  }, 'Importer');
}

// L'import réussit même si certaines lignes ont posé problème : on les liste
// plutôt que de les noyer dans un toast qui disparaît au bout de 3 secondes.
function showImportReport(created, errors){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Import terminé</h3>
      <p style="font-size:14px;margin-bottom:12px;">
        <b>${created} tâche(s) importée(s).</b>
        ${errors.length} point(s) d'attention :
      </p>
      <ul class="import-errors">${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
      <div class="modal-actions">
        <button type="button" class="btn accent" id="importReportClose">Fermer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#importReportClose').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

function bindGlobalActions(){
  const themeForm = document.getElementById('themeForm');
  if(themeForm){
    themeForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const f = new FormData(e.target);
      const submitBtn = e.target.querySelector('button[type=submit]');
      submitBtn.disabled = true;
      const payload = {
        companyName: f.get('companyName'),
        logoText: f.get('logoText').toUpperCase(),
        primaryColor: f.get('primaryColor'),
        secondaryColor: f.get('secondaryColor'),
        accentColor: f.get('accentColor'),
        logoDataUrl: null
      };
      const fileInput = document.getElementById('logoFile');
      try{
        if(fileInput && fileInput.files[0]){
          payload.logoDataUrl = await new Promise((resolve,reject)=>{
            const reader = new FileReader();
            reader.onload = ()=>resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(fileInput.files[0]);
          });
        }
        await apiCall('update_settings','POST',payload);
        await refreshState(); render(); toast('Charte graphique mise à jour.');
      }catch(err){ toast(err.message, true); submitBtn.disabled = false; }
    });
  }
  const reportEl = document.getElementById('repSummary');
  if(reportEl){
    const route = currentRoute();
    const m = STATE.meetings.find(x=>x.id===route[1]);
    const report = m ? reportOfMeeting(m.id) : null;
    if(report) bindMeetingActions(report.id);
  }
}
